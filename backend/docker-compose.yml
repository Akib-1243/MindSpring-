services:
  app:
    build: .
    ports:
      - "8000:80"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - laravel_vendor:/var/www/html/vendor
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: relavanet
      MYSQL_USER: relavanet
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - relavanet_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - mysql
volumes:
  relavanet_mysql:
  laravel_vendor:
